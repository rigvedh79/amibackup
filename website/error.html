<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #232f3e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    h1 {
      font-size: 72px;
      margin-bottom: 10px;
      color: #ff9900;
    }

    p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      background: #ff9900;
      color: #111827;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>404</h1>
    <p>The requested page could not be found.</p>
    <a href="index.html">Return to Home</a>
  </div>

</body>
</html>
